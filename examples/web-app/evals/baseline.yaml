# Generated from the experiment design; one skill-up config per variant.
# Variant: baseline (0 skills)
schema_version: v1alpha1
environment:
  type: none
skills: []
engine:
  name: claude_code
  model: {}
cases:
  files:
    - evals/cases/catalog.yaml
  defaults:
    collect_artifacts:
      - "src/**"
      - "package.json"
  parallelism: 1
benchmark:
  enabled: false
report:
  formats: [json, html]
  artifacts: [transcript]
