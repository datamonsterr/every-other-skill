# Generated from the experiment design; one skill-up config per variant.
# Variant: research-first (3 skills)
schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: ../../.otherskill/bank/techstack/prototype--7b59191e267ff6ec
    target: .claude/skills/prototype
  - source: local_path
    path: ../../.otherskill/bank/techstack/research--97e9902009e55cf3
    target: .claude/skills/research
  - source: local_path
    path: ../../.otherskill/bank/techstack/search-first--c888e32d6fbad813
    target: .claude/skills/search-first
engine:
  name: claude_code
  model: {}
cases:
  files:
    - evals/cases/stack.yaml
  defaults:
    collect_artifacts:
      - "**/*.md"
      - "prototype/**"
  parallelism: 1
benchmark:
  enabled: false
report:
  formats: [json, html]
  artifacts: [transcript]
